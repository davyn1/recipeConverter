<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Handle shadow -->
  <line x1="12" y1="21" x2="27" y2="4" stroke="#6b4530" stroke-width="5" stroke-linecap="round"/>
  <!-- Bowl shadow -->
  <ellipse cx="10" cy="22" rx="6" ry="7" transform="rotate(-55 10 22)" fill="#6b4530"/>
  <!-- Handle fill -->
  <line x1="12" y1="21" x2="27" y2="4" stroke="#d4ba80" stroke-width="3" stroke-linecap="round"/>
  <!-- Bowl fill -->
  <ellipse cx="10" cy="22" rx="5" ry="6" transform="rotate(-55 10 22)" fill="#e8d5b0"/>
  <!-- Bowl inner highlight -->
  <ellipse cx="9.5" cy="21.5" rx="2.5" ry="3" transform="rotate(-55 9.5 21.5)" fill="#f5e8c8" opacity="0.7"/>
</svg>
